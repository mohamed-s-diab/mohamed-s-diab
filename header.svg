<svg width="900" height="300" viewBox="0 0 900 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Apple Light Background Gradient -->
    <linearGradient id="bgGradProfile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5F5F7" />
    </linearGradient>

    <!-- Pill Background Gradient -->
    <linearGradient id="pillBgProfile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FAFAFC" />
    </linearGradient>
  </defs>

  <!-- Container Box with Apple Rounded Corners -->
  <rect x="3" y="3" width="894" height="294" rx="20" fill="url(#bgGradProfile)" stroke="#E5E5EA" stroke-width="1.5" />

  <!-- macOS Window Chrome Dots -->
  <circle cx="36" cy="30" r="6" fill="#FF5F56" />
  <circle cx="56" cy="30" r="6" fill="#FFBD2E" />
  <circle cx="76" cy="30" r="6" fill="#27C93F" />

  <!-- Window Header Label -->
  <text x="105" y="34" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="500" letter-spacing="0.3">mohamed-s-diab // personal-profile</text>

  <!-- Top Divider Line -->
  <line x1="3" y1="52" x2="897" y2="52" stroke="#E5E5EA" stroke-width="1" />

  <!-- Eyebrow Category Tag Badge -->
  <g transform="translate(40, 72)">
    <rect width="250" height="24" rx="12" fill="#E8F2FF" stroke="#CCE0FF" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#0071E3"/>
    <text x="24" y="16" fill="#0071E3" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">FACULTY OF MEDICINE · MTI CAIRO</text>
  </g>

  <!-- Main Headline -->
  <text x="40" y="138" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'Inter', sans-serif" font-size="32" font-weight="800" letter-spacing="-0.8">Mohamed Said Mohamed Diab</text>

  <!-- Subtitle -->
  <text x="40" y="168" fill="#6E6E73" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="15" font-weight="400" letter-spacing="-0.2">Medical Student &amp; Researcher · Biostatistics &amp; R Programming</text>

  <!-- Apple Pills Row -->
  <!-- Pill 1: R Programming -->
  <g transform="translate(40, 208)">
    <rect width="186" height="46" rx="10" fill="url(#pillBgProfile)" stroke="#E5E5EA" stroke-width="1" />
    <text x="16" y="28" fill="#0071E3" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="700">💻 R Programming</text>
    <text x="136" y="28" fill="#6E6E73" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="400"></text>
  </g>

  <!-- Pill 2: Evidence Synthesis -->
  <g transform="translate(242, 208)">
    <rect width="206" height="46" rx="10" fill="url(#pillBgProfile)" stroke="#E5E5EA" stroke-width="1" />
    <text x="16" y="28" fill="#F0883E" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="700">📊 Evidence Synthesis</text>
    <text x="150" y="28" fill="#6E6E73" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="400"></text>
  </g>

  <!-- Pill 3: Open Science -->
  <g transform="translate(464, 208)">
    <rect width="186" height="46" rx="10" fill="url(#pillBgProfile)" stroke="#E5E5EA" stroke-width="1" />
    <text x="16" y="28" fill="#34C759" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="700">🔬 Open Science</text>
    <text x="120" y="28" fill="#6E6E73" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="400"></text>
  </g>

  <!-- Pill 4: MTI Affiliation -->
  <g transform="translate(666, 208)">
    <rect width="194" height="46" rx="10" fill="url(#pillBgProfile)" stroke="#E5E5EA" stroke-width="1" />
    <text x="16" y="28" fill="#AF52DE" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="700">📍 MTI University</text>
    <text x="126" y="28" fill="#6E6E73" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="400">Cairo</text>
  </g>
</svg>
